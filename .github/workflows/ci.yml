name: RecallCircuit tests and GenVM lint
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q contracts tests scripts
      - run: python -m pytest tests -q
  genvm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install genvm-linter==0.11.1rc2
      - run: genvm-lint check contracts/recall_circuit.py --json
      - run: genvm-lint check contracts/recall_gate.py --json
